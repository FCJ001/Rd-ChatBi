metrics:
  - name: vehicle_count
    description: 整车数量/下线量统计，使用 COUNT(*) 聚合
    relevant_columns: ["veh_vehicles.id"]
    alias: ["整车数量", "下线量", "产量", "车辆数", "总数"]

  - name: sales_order_count
    description: 销售订单量统计，使用 COUNT(*) 聚合
    relevant_columns: ["sal_sales_orders.id"]
    alias: ["订单量", "订单数", "销量", "成交量", "总数"]

  - name: sales_amount
    description: 销售总金额，SUM(sal_sales_orders.amount)，单位万元
    relevant_columns: ["sal_sales_orders.amount"]
    alias: ["销售额", "销售总额", "成交金额", "总销售额", "金额"]

  - name: delivery_count
    description: 交付量统计，使用 COUNT(*) 聚合
    relevant_columns: ["sal_deliveries.id"]
    alias: ["交付量", "交付数", "交付总数"]

  - name: avg_delivery_days
    description: 平均交付周期（天），AVG(sal_deliveries.lead_days)
    relevant_columns: ["sal_deliveries.lead_days"]
    alias: ["平均交付周期", "交付周期", "平均交付天数"]

  - name: complaint_count
    description: 客户投诉量统计，使用 COUNT(*) 聚合
    relevant_columns: ["qms_customer_complaints.id"]
    alias: ["投诉量", "投诉数", "投诉总数"]

  - name: market_fault_count
    description: 市场故障量统计，使用 COUNT(*) 聚合
    relevant_columns: ["qms_market_faults.id"]
    alias: ["故障量", "市场故障数", "故障总数"]

  - name: avg_ppm
    description: 供应商平均 PPM（百万分之不良率），AVG(qms_ppm_records.ppm)
    relevant_columns: ["qms_ppm_records.ppm"]
    alias: ["平均PPM", "PPM", "不良率"]

  - name: warranty_claim_amount
    description: 质保索赔总金额，SUM(svc_warranty_claims.amount)，单位元
    relevant_columns: ["svc_warranty_claims.amount"]
    alias: ["索赔金额", "索赔总额", "三包费用"]

  - name: svc_wo_count
    description: 维修工单量统计，使用 COUNT(*) 聚合
    relevant_columns: ["svc_work_orders.id"]
    alias: ["维修量", "工单量", "维修工单数", "进厂台次"]

  - name: avg_repair_hours
    description: 平均维修工时（小时），AVG(svc_work_orders.labor_hours)
    relevant_columns: ["svc_work_orders.labor_hours"]
    alias: ["平均维修工时", "维修工时", "平均工时"]

  - name: defect_count
    description: 生产缺陷数量统计，使用 COUNT(*) 聚合
    relevant_columns: ["mfg_station_defects.id"]
    alias: ["缺陷数", "缺陷数量", "不良数"]

  - name: issue_count
    description: 研发缺陷问题单数量统计，使用 COUNT(*) 聚合
    relevant_columns: ["alm_issues.id"]
    alias: ["问题数", "问题单数", "缺陷单数", "缺陷数"]

  - name: test_pass_rate
    description: 测试通过率，COUNT(result='通过')/COUNT(*)
    relevant_columns: ["alm_test_executions.result"]
    alias: ["通过率", "测试通过率"]

  - name: recall_vehicle_count
    description: 召回车辆数量统计，使用 COUNT(*) 聚合
    relevant_columns: ["rcl_recall_vehicles.id"]
    alias: ["召回车辆数", "召回量", "涉及车辆数"]

  - name: ota_success_rate
    description: OTA 安装成功率，COUNT(result='成功')/COUNT(*)
    relevant_columns: ["ota_installations.result"]
    alias: ["升级成功率", "OTA成功率", "安装成功率"]

  - name: avg_soh
    description: 电池平均健康度，AVG(bat_soh_records.soh)，单位%
    relevant_columns: ["bat_soh_records.soh"]
    alias: ["平均SOH", "电池健康度", "SOH"]

  - name: total_charging_kwh
    description: 总充电电量，SUM(iot_charging_sessions.energy_kwh)，单位kWh
    relevant_columns: ["iot_charging_sessions.energy_kwh"]
    alias: ["充电电量", "总充电量", "充电度数"]

  - name: energy_per_100km
    description: 百公里能耗，SUM(energy_kwh)/SUM(distance_km)*100（iot_energy_daily）
    relevant_columns: ["iot_energy_daily.energy_kwh"]
    alias: ["百公里能耗", "能耗", "电耗"]

  - name: trip_distance_total
    description: 总行驶里程，SUM(iot_trip_records.distance_km)，单位公里
    relevant_columns: ["iot_trip_records.distance_km"]
    alias: ["总里程", "行驶里程", "总行驶里程"]

  - name: disengagement_count
    description: 智驾接管事件数量统计，使用 COUNT(*) 聚合
    relevant_columns: ["ad_disengagements.id"]
    alias: ["接管次数", "接管数", "接管总数"]

  - name: inventory_count
    description: 经销商库存数量统计，使用 COUNT(*) 聚合
    relevant_columns: ["sal_inventories.id"]
    alias: ["库存量", "库存数", "在库数量"]

  - name: avg_unit_cost
    description: 平均单车成本，AVG(fin_vehicle_costs.total_cost)，单位元
    relevant_columns: ["fin_vehicle_costs.total_cost"]
    alias: ["单车成本", "平均成本", "单位成本"]

  - name: nps_score
    description: 服务满意度平均分，AVG(svc_customer_feedback.score)
    relevant_columns: ["svc_customer_feedback.score"]
    alias: ["满意度", "服务满意度", "平均满意度", "NPS"]
