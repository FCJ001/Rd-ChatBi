<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rd-chatBI — 智能数据分析助手</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   Design Tokens — 深岩蓝主色
   ══════════════════════════════════════════════════════════════ */
:root {
  --primary: #1E6FFF;
  --primary-hover: #1556CC;
  --primary-light: #EBF3FF;
  --danger: #E32219;
  --danger-light: #FEF2F2;
  --warning: #F59E0B;
  --warning-light: #FFFBEB;
  --success: #10B981;
  --success-light: #ECFDF5;

  --title: #111827;
  --body: #374151;
  --muted: #6B7280;
  --border: #E5E7EB;
  --bg: #F9FAFB;
  --card: #FFFFFF;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);

  --radius: 10px;
  --radius-sm: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  --mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
}

[data-theme="dark"] {
  --primary: #3B8CFF;
  --primary-hover: #5CA0FF;
  --primary-light: #1E3050;
  --title: #F9FAFB;
  --body: #D1D5DB;
  --muted: #9CA3AF;
  --border: #374151;
  --bg: #0F172A;
  --card: #1E293B;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
}

/* ══════════════════════════════════════════════════════════════
   Reset & Base
   ══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: var(--font);
  font-size: 14px; color: var(--body); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════════════════════════════════════
   Top Bar
   ══════════════════════════════════════════════════════════════ */
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  height:52px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:16px;
}
.topbar .logo { font-size:16px; font-weight:700; color:var(--title); white-space:nowrap; }
.topbar .logo span { font-weight:400; color:var(--muted); }
.topbar .dot { width:8px; height:8px; border-radius:50%; background:var(--success); flex-shrink:0; }
.topbar .spacer { flex:1; }
.topbar .icon-btn { width:34px; height:34px; border:none; border-radius:var(--radius-sm); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:18px; }
.topbar .icon-btn:hover { background:var(--bg); color:var(--title); }
.topbar select, .topbar input.role-input {
  font-size:13px; padding:4px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card); color:var(--body); cursor:pointer;
}
.topbar input.role-input { width:72px; cursor:text; }

/* ══════════════════════════════════════════════════════════════
   Chat Layout
   ══════════════════════════════════════════════════════════════ */
.chat-wrap {
  display:flex; flex-direction:column; margin-top:52px; height:calc(100vh - 52px);
  max-width:960px; margin-left:auto; margin-right:auto; width:100%;
}
.chat-history { flex:1; overflow-y:auto; padding:24px 24px 12px; }

/* ── Hero（空会话时的引导页）── */
.chat-hero { text-align:center; padding:60px 0 24px; }
.chat-hero h2 { font-size:22px; color:var(--title); margin-bottom:6px; }
.chat-hero .subtitle { color:var(--muted); font-size:14px; margin-bottom:28px; }
.chat-hero .feature-row { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
.chat-hero .feature {
  padding:8px 16px; border:1px solid var(--border); border-radius:20px; font-size:13px;
  color:var(--body); background:var(--card);
}
.example-row { display:flex; flex-direction:column; gap:10px; max-width:560px; margin:0 auto; }
.example-q {
  padding:12px 16px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--card); cursor:pointer; text-align:left; font-size:14px; color:var(--body);
  transition:all .15s; box-shadow:var(--shadow);
}
.example-q:hover { border-color:var(--primary); color:var(--primary); transform:translateY(-1px); }

/* ── 消息气泡 ── */
.msg { margin-bottom:24px; }
.msg-user { display:flex; justify-content:flex-end; }
.msg-user .bubble {
  max-width:80%; background:var(--primary); color:#fff; padding:10px 16px;
  border-radius:14px 14px 4px 14px; font-size:14px; line-height:1.6; white-space:pre-wrap;
}
.msg-ai .who { font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.msg-ai .who .dot { width:6px; height:6px; border-radius:50%; background:var(--primary); }
.followup-tag {
  font-size:11px; color:var(--warning); background:var(--warning-light);
  border:1px solid var(--warning); border-radius:10px; padding:1px 8px; margin-left:8px;
}

.result-card { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); overflow:hidden; }
.rc-header { padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
.rc-body { padding:16px; }

/* ── BI 结果块 ── */
.bi-section { margin-bottom:20px; }
.bi-section:last-child { margin-bottom:4px; }
.bi-section .bi-label { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
.bi-section .summary-text { font-size:14px; color:var(--body); line-height:1.7; }
.bi-section pre {
  background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:14px; font-family:var(--mono); font-size:12px; overflow-x:auto;
  color:var(--title); position:relative;
}
.bi-section .copy-btn {
  position:absolute; top:6px; right:6px; padding:3px 10px; font-size:11px;
  border:1px solid var(--border); border-radius:3px; background:var(--card); cursor:pointer; color:var(--muted);
}
.bi-section .copy-btn:hover { color:var(--primary); border-color:var(--primary); }

.bi-table { width:100%; border-collapse:collapse; font-size:13px; }
.bi-table th { background:var(--bg); font-weight:600; text-align:left; padding:8px 12px; border:1px solid var(--border); color:var(--title); }
.bi-table td { padding:6px 12px; border:1px solid var(--border); color:var(--body); }
.bi-table tr:hover td { background:var(--bg); }

.chart-container { width:100%; height:360px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); }
.chart-type-tag {
  display:inline-block; font-size:11px; color:var(--primary); background:var(--primary-light);
  border-radius:10px; padding:1px 8px; margin-left:8px; text-transform:none;
}

/* ── Pipeline Progress ── */
.pipeline-progress {
  display:flex; flex-wrap:wrap; gap:8px; padding:14px;
  background:var(--bg); border-radius:var(--radius-sm); border:1px solid var(--border);
}
.progress-step {
  font-size:12px; padding:4px 10px; border-radius:12px;
  border:1px solid var(--border); white-space:nowrap;
  transition: all .3s ease;
}
.progress-pending { color:var(--muted); background:var(--card); }
.progress-running {
  color:var(--primary); background:var(--primary-light); border-color:var(--primary);
  animation: pulse 1.2s ease-in-out infinite;
}
.progress-success { color:var(--success); background:var(--success-light); border-color:var(--success); }
.progress-error { color:var(--danger); background:var(--danger-light); border-color:var(--danger); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

/* ── Error ── */
.error-box {
  background:var(--danger-light); border:1px solid var(--danger); border-radius:var(--radius-sm);
  padding:12px 16px; color:var(--danger); font-size:13px;
}

/* ── Input Bar ── */
.input-bar {
  border-top:1px solid var(--border); background:var(--card); padding:14px 24px 18px;
}
.input-row { display:flex; gap:10px; }
.input-row textarea {
  flex:1; resize:none; border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 16px; font-size:14px; font-family:var(--font); color:var(--title);
  background:var(--bg); height:46px; line-height:22px; outline:none;
}
.input-row textarea:focus { border-color:var(--primary); }
.input-row button {
  padding:0 24px; border:none; border-radius:var(--radius); background:var(--primary);
  color:#fff; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.input-row button:hover { background:var(--primary-hover); }
.input-row button:disabled { opacity:.5; cursor:not-allowed; }
.input-hint { font-size:12px; color:var(--muted); margin-top:8px; text-align:center; }

/* ── Empty / Toast / Scrollbar ── */
.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-state .empty-icon { font-size:48px; margin-bottom:12px; }
.toast {
  position:fixed; top:64px; right:20px; z-index:300; padding:10px 20px; border-radius:var(--radius-sm);
  font-size:13px; color:#fff; animation:fadeUp .3s ease;
}
.toast.success { background:var(--success); }
.toast.error { background:var(--danger); }
@keyframes fadeUp { from{transform:translateY(-8px);opacity:0} to{transform:translateY(0);opacity:1} }

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<!-- ═══════════════ Top Bar ═══════════════ -->
<div class="topbar">
  <span class="dot" id="healthDot" title="服务状态"></span>
  <div class="logo">rd-chatBI <span>· 智能数据分析</span></div>
  <div class="spacer"></div>
  <label style="font-size:12px;color:var(--muted)">数据源</label>
  <select id="dsSelect" onchange="onDsChange()"></select>
  <label style="font-size:12px;color:var(--muted)">角色</label>
  <select id="roleSelect" onchange="onRoleChange()">
    <option value="admin">admin（全量）</option>
    <option value="doctor">doctor（本科室）</option>
    <option value="cashier">cashier（已缴费）</option>
    <option value="patient">patient（无权限）</option>
  </select>
  <input class="role-input" id="deptInput" type="number" placeholder="科室ID" title="doctor 角色的科室 ID" style="display:none">
  <label style="font-size:12px;color:var(--muted)">会话</label>
  <input class="role-input" id="sessionId" value="default" style="width:90px">
  <button class="icon-btn" onclick="newSession()" title="新会话">＋</button>
  <button class="icon-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>

<!-- ═══════════════ Chat ═══════════════ -->
<div class="chat-wrap">
  <div class="chat-history" id="chatHistory">
    <div class="chat-hero" id="chatHero">
      <h2>👋 用自然语言查数据</h2>
      <div class="subtitle">自动生成 SQL → 查库 → 推荐图表 → 数据摘要</div>
      <div class="feature-row">
        <span class="feature">💬 自然语言交互</span>
        <span class="feature">📈 智能图表推荐</span>
        <span class="feature">🔁 多轮追问下钻</span>
        <span class="feature">🛡️ 四层安全防线</span>
        <span class="feature">👤 角色权限控制</span>
      </div>
      <div class="example-row">
        <button class="example-q" onclick="fillExample(this)">上个月各科室门诊量TOP10有哪些？</button>
        <button class="example-q" onclick="fillExample(this)">今年门诊收入按月份趋势如何？</button>
        <button class="example-q" onclick="fillExample(this)">各科室平均住院日对比</button>
        <button class="example-q" onclick="fillExample(this)">只要内科的数据</button>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-row">
      <textarea id="chatInput" placeholder="用自然语言提问，如：上个月各科室门诊量TOP10…" onkeydown="onInputKey(event)"></textarea>
      <button id="sendBtn" onclick="sendQuestion()">发送</button>
    </div>
    <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 同一会话支持多轮追问（图表 + 数据表 + SQL + 摘要）</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   State
   ══════════════════════════════════════════════════════════════ */
const BASE = location.origin;
const store = {
  project: localStorage.getItem('chatbi_project') || 'hospital_demo',
  role: localStorage.getItem('chatbi_role') || 'admin',
  deptId: localStorage.getItem('chatbi_dept') || '',
  theme: localStorage.getItem('chatbi_theme') || 'light',
};

// 流水线步骤（与 9 阶段对应）
const STEPS = [
  {key:'抽取关键字', icon:'🔍'},
  {key:'召回字段', icon:'📡'},
  {key:'召回字段取值', icon:'🔗'},
  {key:'召回指标', icon:'📐'},
  {key:'合并召回信息', icon:'🧩'},
  {key:'过滤表格', icon:'🪟'},
  {key:'过滤指标', icon:'🧮'},
  {key:'添加额外上下文信息', icon:'📅'},
  {key:'生成SQL', icon:'⚡'},
  {key:'验证SQL', icon:'✅'},
  {key:'校正SQL', icon:'🛠️'},
  {key:'执行SQL', icon:'🗃️'},
];

/* ══════════════════════════════════════════════════════════════
   Init
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  loadDatasources();
  document.getElementById('roleSelect').value = store.role;
  document.getElementById('deptInput').value = store.deptId;
  onRoleChange();
  if (store.theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
  // 健康检查
  fetch(BASE+'/health').then(r=>r.json()).then(()=>{
    document.getElementById('healthDot').style.background='var(--success)';
  }).catch(()=>{
    document.getElementById('healthDot').style.background='var(--danger)';
  });
});

function toggleTheme() {
  const el = document.documentElement;
  store.theme = store.theme === 'dark' ? 'light' : 'dark';
  if (store.theme === 'dark') el.setAttribute('data-theme','dark');
  else el.removeAttribute('data-theme');
  localStorage.setItem('chatbi_theme', store.theme);
}

async function loadDatasources() {
  try {
    const resp = await fetch(BASE+'/api/v1/bi/datasources');
    const json = await resp.json();
    const list = json.data || [];
    const sel = document.getElementById('dsSelect');
    sel.innerHTML = list.map(d => `<option value="${escHtml(d.code)}">${escHtml(d.name)}</option>`).join('');
    sel.value = store.project;
    if (sel.selectedIndex < 0) { sel.value = list[0]?.code || 'hospital_demo'; store.project = sel.value; }
  } catch(e) { /* 服务未起时静默 */ }
}

function onDsChange() {
  store.project = document.getElementById('dsSelect').value;
  localStorage.setItem('chatbi_project', store.project);
  toast('已切换数据源: ' + store.project, 'success');
}

function onRoleChange() {
  const role = document.getElementById('roleSelect').value;
  store.role = role;
  localStorage.setItem('chatbi_role', role);
  const showDept = role === 'doctor';
  const deptEl = document.getElementById('deptInput');
  deptEl.style.display = showDept ? '' : 'none';
  if (showDept && !deptEl.value) deptEl.value = '1';
  store.deptId = deptEl.value;
  localStorage.setItem('chatbi_dept', deptEl.value);
}

function newSession() {
  document.getElementById('sessionId').value = 's-' + Date.now().toString(36);
  toast('已开启新会话', 'success');
}

function fillExample(btn) {
  document.getElementById('chatInput').value = btn.textContent;
  document.getElementById('chatInput').focus();
}

function onInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
}

function sessionId() { return document.getElementById('sessionId').value || 'default'; }
function userHeaders() {
  const h = {'Content-Type':'application/json','X-User-Id':'web','X-User-Role':store.role,'X-Session-Id':sessionId(),'X-Project-Id':store.project};
  if (store.role === 'doctor' && store.deptId) h['X-Dept-Id'] = store.deptId;
  return h;
}

/* ══════════════════════════════════════════════════════════════
   Chat — SSE 流式查询（9 阶段流水线 + 图表）
   ══════════════════════════════════════════════════════════════ */
async function sendQuestion() {
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  document.getElementById('chatHero')?.remove();

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  // 用户气泡
  appendUserMsg(q);

  // AI 消息骨架
  const msgId = 'msg-' + Date.now();
  appendAIMsgShell(msgId, q);

  const progressMap = {};
  let chart = null, chartConfig = null, followup = false, resolvedQ = q;
  let lastResult = null;

  try {
    const resp = await fetch(BASE+'/api/v1/bi/query-stream',{
      method:'POST',
      headers: userHeaders(),
      body: JSON.stringify({question:q, session_id:sessionId(), with_chart:true})
    });

    if (!resp.ok || !resp.headers.get('content-type')?.includes('text/event-stream')) {
      throw new Error('服务不可用（HTTP '+resp.status+'）');
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const payload = JSON.parse(line.slice(6));

          // ② 多轮上下文判断
          if (payload.node === 'resolve_question') {
            followup = !!payload.data?.is_followup;
            resolvedQ = payload.data?.resolved || q;
            const who = document.querySelector('#'+msgId+' .who');
            if (who && followup) who.insertAdjacentHTML('beforeend','<span class="followup-tag">🔁 基于上一轮追问</span>');
            continue;
          }

          // 进度事件：更新步骤状态
          if (payload.type === 'progress') {
            progressMap[payload.step] = payload.status;
            const el = document.getElementById(msgId+'-progress');
            if (el) el.innerHTML = buildProgressHTML(progressMap);
            continue;
          }

          // 错误事件
          if (payload.node === 'error') {
            lastResult = {success:false, error: payload.data?.error || '执行失败'};
            continue;
          }

          // 节点完成事件
          if (payload.node === 'execute_sql' && payload.data) {
            lastResult = {
              success: !payload.data.result_error,
              sql: payload.data.result_sql || '',
              data: payload.data.result_data || [],
              columns: payload.data.result_columns || [],
              row_count: payload.data.result_row_count || 0,
              summary: payload.data.result_summary || '',
              error: payload.data.result_error || '',
            };
            if (payload.chart) chart = payload.chart;
            if (payload.chart_config) chartConfig = payload.chart_config;
          }
        } catch(ignored) {}
      }
    }

    renderBIResult(msgId, lastResult, chart, chartConfig);
  } catch(e) {
    document.getElementById(msgId+'-body').innerHTML =
      `<div class="error-box">请求失败：${escHtml(e.message)}</div>`;
  }
  btn.disabled = false;
  document.getElementById('chatHistory').scrollTop = 99999999;
}

function appendUserMsg(q) {
  const el = document.getElementById('chatHistory');
  el.insertAdjacentHTML('beforeend', `<div class="msg msg-user"><div class="bubble">${escHtml(q)}</div></div>`);
  el.scrollTop = 99999999;
}

function appendAIMsgShell(msgId, q) {
  const progressStepsHTML = STEPS.map(s =>
    `<span class="progress-step progress-pending" data-step="${s.key}">${s.icon} ${s.key}</span>`
  ).join('');
  const el = document.getElementById('chatHistory');
  el.insertAdjacentHTML('beforeend', `
    <div class="msg msg-ai" id="${msgId}">
      <div class="who"><span class="dot"></span> rd-chatBI</div>
      <div class="result-card">
        <div class="rc-header">9 阶段流水线执行中…</div>
        <div class="rc-body">
          <div class="pipeline-progress" id="${msgId}-progress">${progressStepsHTML}</div>
          <div id="${msgId}-body" style="margin-top:16px;"></div>
        </div>
      </div>
    </div>`);
  el.scrollTop = 99999999;
}

function buildProgressHTML(progressMap) {
  return STEPS.map(s => {
    const st = progressMap[s.key];
    let cls = 'progress-pending', icon = s.icon;
    if (st === 'running') { cls = 'progress-running'; icon = '⏳'; }
    else if (st === 'success') { cls = 'progress-success'; icon = '✅'; }
    else if (st === 'error') { cls = 'progress-error'; icon = '❌'; }
    return `<span class="progress-step ${cls}">${icon} ${s.key}</span>`;
  }).join('');
}

/* ⑧ 返回结果：图表 + 数据表 + SQL + 摘要 */
function renderBIResult(msgId, data, chart, chartConfig) {
  const body = document.getElementById(msgId+'-body');
  if (!data || (!data.success && !data.error)) {
    body.innerHTML = `<div class="empty-state" style="padding:20px"><div class="empty-icon">⚠️</div>未返回有效结果</div>`;
    return;
  }
  if (!data.success) {
    body.innerHTML = `<div class="error-box">⚠️ ${escHtml(data.error || '查询失败')}</div>`;
    return;
  }

  const chartType = chartConfig?.chart_type || '';
  let html = '';

  // 摘要
  if (data.summary) {
    html += `<div class="bi-section"><div class="bi-label">📋 数据摘要</div><div class="summary-text">${escHtml(data.summary)}</div></div>`;
  }
  // 图表
  if (chart) {
    html += `<div class="bi-section"><div class="bi-label">📈 图表${chartType ? `<span class="chart-type-tag">${escHtml(chartType)}</span>` : ''}</div><div class="chart-container" id="${msgId}-chart"></div></div>`;
  }
  // 数据表
  if (data.data && data.data.length) {
    const cols = data.columns?.length ? data.columns : Object.keys(data.data[0]);
    html += `<div class="bi-section"><div class="bi-label">📊 数据表 (${data.row_count} 行)</div><div style="overflow-x:auto"><table class="bi-table"><thead><tr>${cols.map(c=>`<th>${escHtml(c)}</th>`).join('')}</tr></thead><tbody>`;
    html += data.data.slice(0,50).map(row=>`<tr>${cols.map(c=>`<td>${escHtml(String(row[c]??''))}</td>`).join('')}</tr>`).join('');
    html += '</tbody></table></div></div>';
  }
  // SQL
  if (data.sql) {
    html += `<div class="bi-section"><div class="bi-label">💾 生成 SQL</div><pre style="position:relative"><button class="copy-btn" onclick="copyText(this,'${escHtml(data.sql).replace(/'/g,"\\'")}')">复制</button>${escHtml(data.sql)}</pre></div>`;
  }

  body.innerHTML = html;

  // ECharts 渲染
  if (chart) {
    setTimeout(()=>{
      const chartEl = document.getElementById(msgId+'-chart');
      if (chartEl && typeof echarts !== 'undefined') {
        const c = echarts.init(chartEl);
        c.setOption(chart);
        window.addEventListener('resize', ()=>c.resize());
      }
    }, 100);
  }
}

async function clearHistory() {
  try {
    await fetch(BASE+'/api/v1/bi/history/'+sessionId(), {method:'DELETE', headers:userHeaders()});
    toast('会话历史已清除', 'success');
  } catch(e) { toast('清除失败', 'error'); }
}

/* ══════════════════════════════════════════════════════════════
   Utils
   ══════════════════════════════════════════════════════════════ */
function escHtml(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='已复制!'; setTimeout(()=>btn.textContent='复制',1500);
  });
}
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}
</script>
